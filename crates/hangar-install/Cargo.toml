[package]
name = "hangar-install"
description = "The seven-stage installer pipeline: inspect, profile, gate, run, classify, verify, file"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hangar-core    = { workspace = true }
hangar-msfs    = { workspace = true }
hangar-catalog = { workspace = true }
hangar-runtime = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
toml           = { workspace = true }
zip            = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
# The `gate` example discovers the real environment; the crate itself never
# needs Steam.
hangar-steam   = { workspace = true }
# The `drop` example expands a leading `~` in a path typed at a shell.
dirs           = { workspace = true }
