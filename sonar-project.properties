sonar.projectKey=TripleJumpStudios_HangarRS
sonar.organization=triplejumpstudios
sonar.projectName=HangarRS

sonar.sources=crates,simconnect-rs/src
sonar.exclusions=**/target/**,**/assets/**,**/packaging/**,**/archive/**

sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.cobertura.reportPaths=cobertura.xml

# Taint rules (path traversal, filesystem oracle) on the two local Python tools.
# Both are run by hand on the user's own machine with the user's own paths:
# compat/littlenavmap/setup.py reads only the review.json its own `prepare`
# wrote, refuses any existing destination and re-hashes every file before it
# places one; scripts/third_party_licenses.py writes the file named by
# `--output`. There is no other party whose input reaches these paths.
sonar.issue.ignore.multicriteria=lnm,licences
sonar.issue.ignore.multicriteria.lnm.ruleKey=pythonsecurity:*
sonar.issue.ignore.multicriteria.lnm.resourceKey=compat/littlenavmap/setup.py
sonar.issue.ignore.multicriteria.licences.ruleKey=pythonsecurity:*
sonar.issue.ignore.multicriteria.licences.resourceKey=scripts/third_party_licenses.py
